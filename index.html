<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111217">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UNION ONE">
  <meta name="format-detection" content="telephone=no">
  <title>UNION ONE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{--bg:#0f1014;--panel:#18191f;--line:#2a2c35;--text:#f4f5f7;--muted:#9297a3;--accent:#ff5d67}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
    .wrap{width:min(100%,420px);text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-size:28px;font-weight:900;letter-spacing:-1px}
    .brand-dot{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 22px rgba(255,93,103,.35)}
    .sub{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .card{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:left}
    .card strong{display:block;margin-bottom:12px;font-size:15px}
    .step{display:flex;gap:10px;margin:10px 0;color:#d9dce3;font-size:14px;line-height:1.5}
    .num{flex:none;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:900}
    .open-btn{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:15px;background:#fff;color:#111217;font-size:15px;font-weight:900;cursor:pointer}
    .launching{display:none;margin-top:28px;color:var(--muted);font-size:14px}
    .spinner{width:32px;height:32px;margin:0 auto 13px;border:4px solid #343641;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    .note{margin-top:16px;color:#747985;font-size:11px;line-height:1.5}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-dot"></span><span>UNION ONE</span></div>
    <p class="sub">업무 플랫폼을 실행합니다.</p>
    <section id="installPanel" class="card">
      <strong>실행 방법</strong>
      <div class="step"><span class="num">1</span><span>홈 화면에 설치된 UNION ONE 아이콘으로 실행해 주세요.</span></div>
      <div class="step"><span class="num">2</span><span>처음 연결되는 기기는 한 번만 로그인하면 이후 자동 연결됩니다.</span></div>
      <button id="openButton" class="open-btn" type="button">업무 플랫폼 열기</button>
    </section>
    <section id="launchingPanel" class="launching">
      <div class="spinner"></div>
      UNION ONE 업무 플랫폼을 여는 중입니다.
    </section>
    <p class="note">업무 데이터는 회사 Google Sheets와 연동됩니다.</p>
  </main>

  <script>
    const WORKBOARD_APP_URL = "https://script.google.com/macros/s/AKfycbxHirretvYo0aE-R8P5bwuORhtn-R2gL8pK0pNLXMSxQDpOS9lBn_YPGV2sqpfgov8g/exec";
    const DEVICE_TOKEN_KEY = "unionone_workboard_launcher_device_v1";
    const LEGACY_DEVICE_TOKEN_KEYS = [
      "ncore_workboard_launcher_device_v1",
      "ncore_workboard_device_v1",
      "unionone_workboard_device_v1"
    ];

    function validToken(value) {
      return /^[A-Za-z0-9_-]{20,64}$/.test(String(value || "").trim());
    }

    function getOrCreateDeviceToken() {
      const current = localStorage.getItem(DEVICE_TOKEN_KEY);
      if (validToken(current)) return current;

      for (const key of LEGACY_DEVICE_TOKEN_KEYS) {
        const old = localStorage.getItem(key);
        if (validToken(old)) {
          localStorage.setItem(DEVICE_TOKEN_KEY, old);
          return old;
        }
      }

      const query = new URLSearchParams(window.location.search || "");
      const supplied = query.get("dt");
      if (validToken(supplied)) {
        localStorage.setItem(DEVICE_TOKEN_KEY, supplied);
        return supplied;
      }

      const token =
        window.crypto && crypto.randomUUID
          ? crypto.randomUUID().replace(/-/g, "")
          : "device_" + Date.now() + "_" + Math.random().toString(36).slice(2);

      localStorage.setItem(DEVICE_TOKEN_KEY, token);
      return token;
    }

    function isStandalone() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.navigator.standalone === true ||
        document.referrer.startsWith("android-app://")
      );
    }

    function openWorkboard() {
      document.getElementById("installPanel").style.display = "none";
      document.getElementById("launchingPanel").style.display = "block";
      const deviceToken = getOrCreateDeviceToken();
      const separator = WORKBOARD_APP_URL.includes("?") ? "&" : "?";
      window.location.replace(
        WORKBOARD_APP_URL + separator + "dt=" + encodeURIComponent(deviceToken)
      );
    }

    document.getElementById("openButton").addEventListener("click", openWorkboard);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./service-worker.js");
        } catch (e) {
          try { await navigator.serviceWorker.register("./sw.js"); } catch (_) {}
        }
      });
    }

    if (isStandalone()) {
      document.getElementById("installPanel").style.display = "none";
      document.getElementById("launchingPanel").style.display = "block";
      setTimeout(openWorkboard, 350);
    }
  </script>
</body>
</html>
